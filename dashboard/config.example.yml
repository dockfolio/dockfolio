apps:
  # === SaaS Products ===
  - name: My SaaS App
    type: saas
    domain: my-saas.example.com
    port: 3000
    health: /health
    containers:
      - my-saas-api-1
      - my-saas-postgres-1
      - my-saas-redis-1
    description: Your SaaS product description
    tech: Node.js + PostgreSQL + Redis
    repo: /opt/my-saas
    envFile: /opt/my-saas/.env
    composeFile: /opt/my-saas/docker-compose.yml
    marketing:
      tagline: Your app tagline
      targetAudience: Your target audience
      languages: [en]
      pricingUrl: https://my-saas.example.com/#pricing

  # === Tools ===
  - name: My Tool
    type: tool
    domain: my-tool.example.com
    port: 3001
    health: /
    containers:
      - my-tool-web-1
    description: Your tool description
    tech: Node.js
    repo: /opt/my-tool
    envFile: /opt/my-tool/.env
    composeFile: /opt/my-tool/docker-compose.yml

  # === Infrastructure ===
  - name: Plausible Analytics
    type: infra
    domain: plausible.example.com
    port: 8000
    health: /
    containers:
      - plausible-plausible-1
      - plausible-plausible_db-1
      - plausible-plausible_events_db-1
    description: Self-hosted web analytics
    tech: Elixir + PostgreSQL + ClickHouse
    repo: /opt/plausible

  # === Static Sites ===
  - name: My Blog
    type: static
    domain: blog.example.com
    health: /
    containers: []
    description: Personal blog
    tech: Astro
    repo: /opt/my-blog

  - name: The Design Inference
    type: static
    domain: thedesigninference.org
    health: /
    containers: []
    description: Evidence first 3D scrollytelling site arguing the design inference. Creator agnostic, skeptic aimed.
    tech: Next.js 14 (static export) + Three.js + R3F
    repo: /home/deploy/thedesigninference.org

  # === Redirects ===
  - name: OldDomain.com
    type: redirect
    domain: old-domain.com
    redirectTo: new-domain.com
    containers: []
    description: Domain redirect

# Cross-promotion pairings: which apps promote which.
# Each entry maps a source app (where the banner appears) to target apps (what gets promoted).
# - source: app slug where the banner is displayed
# - targets: list of app slugs to promote on that source (max 2 recommended)
# - Each target needs a banner in the banners table; use POST /api/marketing/crosspromo/provision to auto-create them.
# Rules: same-language only, no self-promo, max 2 targets per source.
crossPromo:
  # German career/finance cluster
  - source: abschlusscheck
    targets: [lohncheck, headshot-ai]
  - source: lohncheck
    targets: [abfindungsoptimizer, headshot-ai]
  - source: headshot-ai
    targets: [abschlusscheck, lohncheck]
  - source: abfindungsoptimizer
    targets: [lohncheck, schenkungsplaner]
  - source: schenkungsplaner
    targets: [abfindungsoptimizer, best-age]

  # German community/lifestyle
  - source: best-age
    targets: [schenkungsplaner]

  # English maker/creative cluster
  - source: promoforge
    targets: [bannerforge]
  - source: bannerforge
    targets: [promoforge]
  - source: old-world-logos
    targets: [sacredlens]
  - source: creative-programmer
    targets: [code-with-rigor]
  - source: code-with-rigor
    targets: [creative-programmer]
  - source: theadhdmind
    targets: [creative-programmer]
